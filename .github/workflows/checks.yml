name: Environment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate demo JSON
        run: python3 -m json.tool demo/initial-data.json > /dev/null

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci_validation_only
        run: docker compose -f infra/compose.yaml config --quiet
